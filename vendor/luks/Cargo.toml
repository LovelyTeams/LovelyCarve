[package]
name         = "luks-core"
description   = "Pure-Rust LUKS1/LUKS2 reader and decryptor — parse the on-disk header, derive the master key, and decrypt the payload. Panic-free, no unsafe."
version = "0.1.8"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
authors = ["Albert Hui <albert@securityronin.com>"]
repository = "https://github.com/SecurityRonin/luks-forensic"
readme       = "README.md"
keywords     = ["luks", "forensics", "dm-crypt", "encryption", "cryptsetup"]
categories   = ["cryptography", "filesystem", "parser-implementations"]

[lib]
name = "luks"

[features]
default = []
# forensic-vfs EncryptionLayer contract (optional): present a decrypted LUKS payload
# as an ImageSource. Behind the `vfs` feature (ADR 0004). The decryption is
# luks-core's own audited RustCrypto (AES-XTS + PBKDF2/Argon2); this only wires it.
vfs = ["dep:forensic-vfs"]

[dependencies]
thiserror = "2"
forensic-vfs = { version = "0.7", optional = true }
aes = { version = "0.8", features = ["zeroize"] }
blowfish = { version = "0.9", features = ["zeroize"] }
cbc = "0.1"
rc4 = { version = "0.1", features = ["zeroize"] }
serpent = { version = "0.5", features = ["zeroize"] }
zeroize = "1"
xts-mode = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = "0.5"
serde_json = "1"
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"
