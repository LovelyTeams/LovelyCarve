version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["LovelyCarve contributors"]
description = "Immutable GFS2 volume reader over positioned byte sources"

[dependencies]
lamfold = { path = "../lamfold", default-features = false, features = ["std"] }

