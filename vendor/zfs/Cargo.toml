[package]
name = "zfs-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = [
    "Jacob Hughes <j@jacobhughes.me>",
]
description = "Read-only ZFS reader, vendored from https://github.com/Hopffenn/zfs-rs and patched for stable Rust + lovelycarve integration (no nightly backtrace, in-tree CRC-64-ECMA, modern lz4)."
rust-version = "1.85.0"

[lib]
name = "zfs_rs"
path = "src/lib.rs"

[dependencies]
nom = "5.1"
enum-repr-derive = "0.1.3"
thiserror = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
