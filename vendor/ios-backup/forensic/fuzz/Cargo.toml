[package]
name = "ios-backup-forensic-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Own workspace root — see core/fuzz/Cargo.toml.
[workspace]

[[bin]]
name = "fuzz_forensic"
path = "fuzz_targets/fuzz_forensic.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
ios-backup-core = { path = "../../core" }
ios-backup-forensic = { path = ".." }
tempfile = "3"
