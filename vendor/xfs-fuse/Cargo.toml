[package]
name = "xfs-fuse"
version = "0.6.0"
edition = "2021"
license = "BSD-2-Clause"
authors = [
    "Khaled Emara <mail@khaledemara.dev>",
    "Alan Somers <asomers@gmail.com>",
]
description = "Read-only XFS reader, vendored from xfuse (https://github.com/KhaledEmaraDev/xfuse) and patched for cross-platform (Windows) builds in lovelycarve. The FUSE server, libfuse bindings, and Unix-only OsStr/libc types are stripped; the on-disk parser is exposed as a Read+Seek-driven Volume."
rust-version = "1.85.0"

[dependencies]
bincode-next = { version = "2.1.0", default-features = false, features = ["derive", "std"] }
bitflags = "2.4"
byteorder = "1.4.3"
crc = "2.0.0"
enum_dispatch = "0.3.12"
num-derive = "0.4.2"
num-traits = "0.2.14"
tracing = "0.1.41"
uuid = "1.0"

[dev-dependencies]
rstest = "0.19.0"
