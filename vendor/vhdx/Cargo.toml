[package]
name = "vhdx-core"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust VHDX (Hyper-V) virtual-disk container library — reader (writer planned), hardened for forensic use"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/vhdx-forensic"
homepage = "https://github.com/SecurityRonin/vhdx-forensic"
documentation = "https://docs.rs/vhdx-core"
authors = ["Albert Hui"]
keywords = ["forensics", "vhdx", "disk-image", "windows", "hyper-v"]
categories = ["parser-implementations", "filesystem"]
readme = "README.md"
exclude = ["tests/"]

[lib]
name = "vhdx"

[features]
# Implement the forensic-vfs ImageSource contract so a decoded VHDX composes
# directly into the fleet VFS. Off by default (optional forensic-vfs dep).
vfs = ["dep:forensic-vfs"]

[dependencies]
thiserror = "2"
forensic-vfs = { version = "0.3", optional = true }

[dev-dependencies]
forensic-testgate = "0.1"
tempfile = "3"
forensic-vfs = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
format_collect = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }


[workspace]
