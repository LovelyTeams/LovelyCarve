[package]
name = "jffs2"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Bounded read-only JFFS2 library adapted from xmoezzz/jffs2-rs"

[dependencies]
anyhow = "1"
crc = "3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lzokay = { version = "2.0.1", default-features = false, features = ["decompress", "std"] }

[workspace]
