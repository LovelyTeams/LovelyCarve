# Vendored copy of the `fatfs` crate (https://github.com/rafalh/rust-fatfs)
# at v0.4.0, licensed MIT. lovelycarve drives it from `core/fat_volume.rs`
# for read-only FAT12/FAT16/FAT32 listing + file extraction. No upstream
# behavior is altered.
#
# Local trims compared to upstream:
#   * `src/fs.rs` line 620: `root_dir(&self) -> Dir<IO, TP, OCC>` annotated
#     to `Dir<'_, IO, TP, OCC>` to silence the `mismatched_lifetime_syntaxes`
#     lint introduced in newer rustc. Pure syntactic clarification — the
#     elided lifetime was already what the compiler inferred.

[package]
name = "fatfs"
version = "0.4.0"
authors = ["Rafał Harabień <rafalh92@outlook.com>"]
edition = "2021"
rust-version = "1.68"
repository = "https://github.com/rafalh/rust-fatfs"
readme = "README.md"
keywords = ["fat", "filesystem", "no_std"]
categories = ["filesystem"]
license = "MIT"
description = """
FAT filesystem library.
"""
exclude = [
    "resources/*",
]

[features]
# Use Rust std library
std = []
# LFN (Long File Name) support
lfn = []
# Use dynamic allocation. When used without std please enable core_io/collections
alloc = []
# Full Unicode support. Disabling it reduces code size by avoiding Unicode-aware character case conversion
unicode = []
# Enable only error-level logging
log_level_error = []
# Enable logging levels warn and up
log_level_warn  = ["log_level_error"]
# Enable logging levels info and up
log_level_info  = ["log_level_warn"]
# Enable logging levels debug and up
log_level_debug = ["log_level_info"]
# Enable all logging levels: trace and up
log_level_trace = ["log_level_debug"]

# Default features
default = ["chrono", "std", "alloc", "lfn", "unicode", "log_level_trace"]

[dependencies]
bitflags = { version = "2", default-features = false }
log = { version = "0.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
