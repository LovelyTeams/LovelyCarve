[package]
name = "udif"
version = "0.4.2"
edition = "2024"
description = "cross-platform Apple disk image (aka DMG, UDIF) library"
license = "MIT"
repository = "https://github.com/Dil4rd/dpp"
keywords = ["dmg", "apple", "macos", "disk-image", "udif"]
categories = ["compression", "encoding", "parsing"]

[dependencies]
thiserror = "2"
byteorder = "1.5"
flate2 = "1.0"
bzip2 = "0.6"
lzfse_rust = "0.2"
lzma-rust2 = "0.21"
rayon = { version = "1.10", optional = true }
plist = "1"
crc32fast = "1.4"


[features]
default = ["extract", "list", "create"]
extract = []
list = []
create = []
parallel = ["rayon"]


[dev-dependencies]
tempfile = "3"
