[package]
name = "lovelycarve-desktop"
description = "LovelyCarve's native desktop app, built with GPUI Kit."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "LovelyCarve"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
winapi = { workspace = true, features = ["libloaderapi", "winuser"] }

[dependencies]
chrono.workspace = true
dirs.workspace = true
# Backend events reach the GPUI foreground executor over an unbounded channel.
futures = "0.3.31"
# GPUI, GPUI Base, GPUI Component and the default icon assets.
gpui-kit = { version = "0.9.0", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
lovelycarve-backend.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
# Compiles `assets/icons/app.rc` into the executable's icon resource on
# Windows (GPUI Kit already uses it for the manifest).
embed-resource = "3.0.12"

[lints]
workspace = true
