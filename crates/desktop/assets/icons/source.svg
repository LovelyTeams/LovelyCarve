<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    App-icon rendition of the brand mark (crescent moon + sparkle), with the
    light-theme brand tokens baked in over a black rounded-square backdrop so
    the pale moon + warm sparkle pop on any taskbar / desktop background.
    Render with Chromium/resvg at 1024px to refresh source.png, then export
    the 512px brand images and icon.ico from it.
  -->
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <filter id="brand-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <mask id="brand-crescent-cut">
      <rect x="-100" y="-100" width="400" height="400" fill="white" />
      <circle cx="122" cy="88" r="54" fill="black" />
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#icon-bg)" />

  <g transform="translate(512 512) scale(4.3) translate(-100 -106)">
    <circle cx="94" cy="108" r="70" fill="rgba(244, 214, 167, 0.32)" filter="url(#brand-soft-glow)" />
    <circle cx="94" cy="108" r="66" fill="#f1f5f9" mask="url(#brand-crescent-cut)" />
    <circle cx="94" cy="108" r="66" fill="none" stroke="#cbd5e1" stroke-width="4" mask="url(#brand-crescent-cut)" />
    <circle cx="98" cy="112" r="58" fill="rgba(255, 255, 255, 0.7)" opacity="0.72" mask="url(#brand-crescent-cut)" />

    <circle cx="128" cy="104" r="18" fill="#fde68a" opacity="0.58" filter="url(#brand-soft-glow)" />
    <circle cx="128" cy="104" r="9" fill="#fef3c7" opacity="0.82" />
    <circle cx="128" cy="104" r="6.5" fill="#f59e0b" />

    <g fill="#f59e0b">
      <rect x="122" y="69" width="12" height="26" rx="6" />
      <rect x="122" y="114" width="12" height="26" rx="6" />
      <rect x="92" y="98" width="26" height="12" rx="6" />
      <rect x="138" y="98" width="30" height="12" rx="6" />
    </g>

    <g fill="#fb7185">
      <rect x="103" y="83" width="10" height="22" rx="5" transform="rotate(-45 108 94)" />
      <rect x="143" y="112" width="10" height="22" rx="5" transform="rotate(-45 148 123)" />
      <rect x="103" y="112" width="10" height="22" rx="5" transform="rotate(45 108 123)" />
      <rect x="143" y="83" width="10" height="22" rx="5" transform="rotate(45 148 94)" />
    </g>

    <circle cx="168" cy="84" r="5" fill="#f59e0b" />
    <circle cx="156" cy="145" r="4" fill="#fb7185" />
    <circle cx="93" cy="71" r="3.5" fill="#f59e0b" />
    <circle cx="112" cy="156" r="3" fill="#94a3b8" />
    <circle cx="149" cy="60" r="2.5" fill="#fb7185" />
    <circle cx="176" cy="109" r="2.5" fill="#94a3b8" />
  </g>
</svg>
