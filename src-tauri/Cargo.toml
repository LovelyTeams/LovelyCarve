[package]
name = "lovelycarve"
version = "1.1.0"
description = "LovelyCarve — a forensic carver with a soft heart."
authors = ["LovelyCarve contributors"]
edition = "2021"
license = "AGPL-3.0-only"
# WOF's pure Rust XPRESS/LZX decoder (ms-compress) requires 1.99.
# The installed toolchain is newer; keep the manifest truthful.
rust-version = "1.99"
# Multiple binary targets exist (desktop and CLI tools). `tauri dev`
# runs a bare `cargo run`, and `tauri build` picks the main bundle binary by
# `default-run` / package name — both need this to keep pointing at the app.
default-run = "LovelyCarve"
# Example names remain stable while source files are grouped by responsibility.
autoexamples = false

[lib]
name = "lovelycarve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Force the raw cargo binary to LovelyCarve.exe (matches `productName` in
# tauri.conf.json). Without this, the bin target defaults to the lowercase
# package name `lovelycarve`, so `target/release/lovelycarve.exe` mismatched
# the bundled `LovelyCarve.exe`.
[[bin]]
name = "LovelyCarve"
path = "src/main.rs"

[[bin]]
name = "lovelycarve-cli"
path = "src/bin/lovelycarve-cli.rs"

[features]
# 默认不启用 QR/OCR；通过 just 的 *-full 入口显式启用。
# 原类型视图「二维码识别」（模仿 LoveLy-QRCode-Scanner：WeChat 检测器 + 暴力变换）按需开启。
# opencv crate 仅是绑定层，编译还需系统预装**带 contrib（wechat_qrcode 模块）的 OpenCV** + LLVM，
# 运行时附带 OpenCV DLL。用 `just build-full` / `just dev-full`（进 VS
# dev shell、指向 OpenCV）构建完整应用；轻量检查（check / clippy / test）用
# `--no-default-features` 保持 OpenCV-free（`qr_scan` 仍注册，但返回带启用指引的错误）。
# 运行时优先用 WeChat CNN 检测器，失败回退标准 objdetect::QRCodeDetector（同一构建内即有，无需单独档）。
default = []
# Legacy DLL probes only; production ReFS always uses the Rust reader.
refs-dll-oracle = []
qrcode-wechat = [
    "dep:opencv",
    "opencv/objdetect",
    "opencv/imgcodecs",
    "opencv/imgproc",
    "opencv/wechat_qrcode",
    "opencv/dnn",
]
# 原类型视图「文字识别（OCR）」（PP-OCRv6-tiny，oar-ocr + 已有的 ONNX Runtime）按需开启。
# `ocr` 是 CPU 基线（纯 Rust + 复用 magika 同版本的 ort，无需 OpenCV）；`ocr-cuda` 叠加 NVIDIA
# CUDA 执行提供者（带 CPU 回退，无 GPU 时自动退化），由 Windows *-full 入口启用。轻量检查（check /
# clippy / test）用 `--no-default-features` 保持 oar-ocr-free（`ocr_scan` 仍注册，返回启用指引错误）。
# macOS 无 CUDA 二进制：改用 `--no-default-features --features "qrcode-wechat ocr"` 走 CPU OCR。
ocr = ["dep:oar-ocr", "dep:oar-ocr-core", "dep:image"]
ocr-cuda = ["ocr", "oar-ocr/cuda"]

[dependencies]
ad1 = { package = "ad1-core", path = "vendor/ad1" }
aes = "0.9.3"
# 逻辑搜索（文件方式）关键词匹配：多模式 Aho-Corasick，Standard 模式报告全部
# 命中（含重叠），逐编码（ASCII/UTF-8/UTF-16LE/UTF-16BE/GBK）各建一台自动机。
aho-corasick = "1.1.5"
anyhow = "1.0.104"
apfs = { path = "vendor/apfs" }
backhand = { path = "vendor/backhand", default-features = false, features = ["xz", "gzip", "zstd", "parallel", "error-strings", "descriptive-errors"] }
base64 = "0.23.1"
# 快照 `.dirz` 体的二进制编码（替代逐条 serde_json，省每条目分配 + 加速加载解析）。
# 3.0.0 仅包含停维护公告和 compile_error，保留可用的 2.0.1 与既有快照格式。
bincode = { version = "2.0.1", features = ["serde"] }
binrw = { version = "0.15.2", default-features = false, features = ["std"] }
bitlocker = { package = "bitlocker-core", path = "vendor/bitlocker" }
btrfs-diskformat = { path = "vendor/btrfs-diskformat", features = ["std"] }
byteorder = "1.5.0"
bytes = "1.12.1"
# Excel「原类型视图」值/格式解析（纯 Rust，无 FFI）：xlsx/xlsm/xlsb/xls/ods 值、
# sheet 可见性、合并区（xlsx/xls）。`dates` 启用 ExcelDateTime → 日期渲染。富样式
# 由 umya-spreadsheet 互补提供（见下）。
calamine = { version = "0.36.1", default-features = false, features = ["dates"] }

cdfs = { path = "vendor/cdfs", default-features = false }
# 文本「原类型视图 / 文本视图」字符编码自动检测（chardetng = Firefox 遗留内容
# 检测器，原生覆盖 GBK/GB18030/Big5/Shift-JIS/EUC-* 并直接返回 encoding_rs 的
# Encoding）+ encoding_rs 解码为 UTF-8，避免非 UTF-8 文本被当 UTF-8 解出乱码。纯 Rust。
chardetng = "1.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
# lovelycarve-cli 的子命令、参数解析和帮助信息。
clap = { version = "4.6.7", features = ["derive", "string"] }
# 配合 chardetng 把检测出的编码解码为 UTF-8（WHATWG 标准实现，BOM 识别 + 替换字符
# 反馈）。chardetng 已传递依赖它，这里显式声明供 core::text_decode 直接使用。
encoding_rs = "0.8.42"
ewf = { path = "vendor/ewf", default-features = false }
exfat = { path = "vendor/exfat", default-features = false, features = ["std"] }
ext4-view = { path = "vendor/ext4-view", default-features = false, features = ["std"] }
fatfs = { path = "vendor/fatfs", default-features = false, features = ["std", "alloc", "lfn", "unicode"] }
filevault = { package = "filevault-core", path = "vendor/filevault/core" }
filevault-forensic = { path = "vendor/filevault/forensic" }
flate2 = "1.1.10"

fs2 = "0.4.3"
# 二进制「原类型视图」结构化解析：ELF / Mach-O / PE / Unix ar 统一走 goblin 的
# Object::parse（纯 Rust，无 FFI）。默认 features 已含 elf32/64、mach32/64、pe32/64、
# te、archive、endian_fd，满足 Object::parse。
goblin = "0.10.7"
gpt = { path = "vendor/gpt" }
gzipf = { path = "vendor/gzipf" }
hex = "0.4.3"
hfsplus = { path = "vendor/hfsplus" }
# 原类型视图「文字识别（OCR）」把文件字节解成 RgbImage 喂给 oar-ocr（仅 `ocr` feature）。
# 版本对齐 oar-ocr 传递依赖的 image 0.25，cargo 统一为同一版本。
image = { version = "0.25.10", optional = true }
ios-backup-core = { path = "vendor/ios-backup/core" }
ios-backup-forensic = { path = "vendor/ios-backup/forensic" }
libloading = "0.9.0"
# DLL plugin C ABI, LPP wire types and the shared plugin-library loader
# (plugins/sdk; the plugins and lc-plugin-host build in their own workspace).
lovelycarve-plugin = { path = "../plugins/sdk", features = ["loader"] }
lru = "0.18.5"
luks = { path = "vendor/luks", package = "luks-core" }
lzokay = { version = "2.0.1", default-features = false, features = ["decompress", "std"] }
magika = { path = "vendor/magika" }
md-5 = "0.11.0"

memchr = "2.8.3"
memmap2 = "0.9.11"
ms-compress = { version = "=0.2.0", default-features = false, features = ["std", "xpress", "lzx"] }
notatin = { path = "vendor/notatin" }
ntfs = { path = "vendor/ntfs" }
ntfs-core = { version = "0.9.8", default-features = false }
# 原类型视图「文字识别（OCR）」引擎（仅 `ocr` feature）：PP-OCRv6-tiny 检测+识别管线。
# 复用 magika 同版本的 ort 2.0.0-rc.12（ONNX Runtime 不冲突），纯 Rust，不依赖 OpenCV。
# 默认 features（download-binaries + simd）即 CPU；`ocr-cuda` 经 `oar-ocr/cuda` 叠加 GPU 路径。
oar-ocr = { version = "0.7.4", optional = true }
# 直接命名 OrtSessionConfig / OrtExecutionProvider 以显式配置执行提供者（CUDA 优先 + CPU 回退）；
# 与 oar-ocr 同版本，无冲突。
# 0.10 要求 ort rc.13，与 vendored magika 的 rc.12 固定版本冲突；两者暂留 0.7。
oar-ocr-core = { version = "0.7.4", optional = true }
# 原类型视图「二维码识别」引擎（仅 `qrcode-wechat` feature）：
# objdetect::QRCodeDetector 检测/解码、imgcodecs::imdecode 从字节解图、imgproc/core 做
# 灰度/对比度/亮度/模糊/缩放/反色/二值化的暴力变换；并启用 WeChat 检测器（wechat_qrcode）。
# 具体启用的 OpenCV 模块由上面的 feature 经 `opencv/<模块>` 选择，需系统 OpenCV + LLVM。
opencv = { version = "0.101.1", optional = true, default-features = false }
# magika 依赖 ort 但把链接方式留给最终二进制；download-binaries 让 ort 的
# build script 在构建期拉取并静态链接 ONNX Runtime，运行时无需额外 DLL。
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-native"] }
parking_lot = "0.12.5"
phdi = { path = "vendor/phdi" }
plist = "1.10.1"
qcow2 = { path = "vendor/qcow2" }
quick-xml = "0.42.0"
rayon = "1.12.0"
realm-db-reader = { path = "vendor/realm-db-reader" }
refs-reader = { path = "vendor/refs-reader" }
# 全局搜索的正则通道：bytes 正则扫 ASCII/UTF-8 原始字节，
# GBK/UTF-16 走解码文本侧再映射回字节偏移；regex-syntax 从正则语法树推必含
# 字面量，给解码文本通道做原始字节预筛。
regex = "1.13.1"
regex-syntax = "0.8.11"
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
rsqlite-vfs = { path = "vendor/rsqlite-vfs" }
rufs = { path = "vendor/rufs" }

rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "collation", "hooks"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# 7z 解压（雷电模拟器 .ldbk 备份为 LZMA2 7z 容器，内含 *.vmdk）。纯 Rust，无 C
# 依赖；只用解压路径，关掉默认的压缩/加密 feature 缩小依赖面。
sevenz-rust2 = { version = "0.24.0", default-features = false }
sha1 = "0.11.0"
sha2 = "0.11.0"
sm3 = "0.5.0"
smraw = { path = "vendor/smraw" }
sqlite-core = { path = "vendor/sqlite-core" }
tar = "0.4.46"
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tempfile = "3.27.0"

thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.2", features = ["sync", "rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
udif = { path = "vendor/udif" }
# Excel「原类型视图」富样式（仅 .xlsx/.xlsm）：字体/填充/边框/对齐/数字格式 +
# 内置主题色(+tint)→RGB 解析。calamine 不暴露样式，二者优势互补。纯 Rust。
# 注：3.0 的加密/imagesize 依赖未做 feature 门，default-features=false 无收益。
umya-spreadsheet = "3.1.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vdi = { path = "vendor/vdi" }
veracrypt = { path = "vendor/veracrypt", package = "veracrypt-core" }
vhd = { package = "vhd-core", path = "vendor/vhd" }
vhdx = { package = "vhdx-core", path = "vendor/vhdx" }
vmdk = { package = "vmdk-core", path = "vendor/vmdk", features = ["full-encoding", "trace"] }
vsc = { package = "vsc-core", path = "vendor/vsc" }
xfs-fuse = { path = "vendor/xfs-fuse" }
zerocopy = "0.8.62"
zeroize = "1"
zfs-rs = { path = "vendor/zfs" }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# lovelycarve-cli 的 Ctrl+C 处理，确保后台任务和挂载会话干净关闭。
ctrlc = "3.5.2"
dokan = "0.3.1"
dokan-sys = "0.3.1"
# widestring is pinned to 0.4 by the dokan 0.3.1 FFI boundary: dokan's
# FileSystemHandler trait + DOKAN_* structs use widestring 0.4 `U16CStr`/
# `UCString<u16>` types, and dokan_mount.rs passes those values straight in.
# Bumping to 1.x forks the type across the crate-version boundary (E0053/E0308),
# so this tracks dokan (itself pinned to dokan2.dll) rather than the latest.
widestring = "0.4"
winapi = { version = "0.3.9", features = ["fileapi", "handleapi", "ioapiset", "jobapi2", "minwinbase", "ntdef", "ntstatus", "winioctl", "winnt"] }

[build-dependencies]
quote = "1.0.47"
serde_json = "1.0.154"
syn = { version = "3.0.8", features = ["full", "visit"] }
tauri-build = { version = "2.7.2", features = [] }

[dev-dependencies]
# The AD1 tests build images with the reader's independent fixture encoder.
ad1 = { package = "ad1-core", path = "vendor/ad1", features = ["testfix"] }
# ReFS replacement candidates are probe-only until real-image parity is demonstrated.
librefs-rust = { package = "librefs", version = "=0.1.0", default-features = false, features = ["std", "sha2"] }
refs-core = "=0.1.0"
syn = { version = "3.0.8", features = ["full"] }

# Mechanically enforced subset of the AGENTS.md Rust conventions. Existing
# violations are warnings (not errors); `cargo clippy --fix
# --no-default-features --allow-dirty` rewrites the format-args ones.
[lints.clippy]
uninlined_format_args = "warn"

# Real LUKS2 keyslots can request 1 GiB of Argon2 memory for several passes.
# Keep their KDF optimised in development too, so debug overhead does not
# trigger the reader's wall-clock derivation budget for valid evidence.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# unwind（非 abort）：让 core::xlsx_table 的 catch_unwind 在发行版也能兜住
# umya-spreadsheet 解析恶意/畸形 .xlsx 时的 panic —— 取证工具处理敌对镜像，
# 单个坏文件不能 abort 整个 app（降级为「仅值、无样式」）。
panic = "unwind"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

# Size-first overall, but the byte-crunching hot paths (image hashing, zstd
# snapshot bodies, deflate/xz/bzip2 containers, SQLCipher, keyword/regex
# scans) get full optimisation. The `-sys` crates are C code compiled by `cc`
# outside rustc's LTO, so their opt-level applies directly; compare against
# `--profile release-fast` when tuning.
[profile.release.package.filevault-core]
opt-level = 3

[profile.release.package.xts-mode]
opt-level = 3

[profile.release.package.aes-kw]
opt-level = 3

[profile.release.package.crc]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[profile.release.package.blowfish]
opt-level = 3
[profile.release.package.cbc]
opt-level = 3
[profile.release.package.rc4]
opt-level = 3
[profile.release.package.serpent]
opt-level = 3

[profile.release.package.pbkdf2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.md-5]
opt-level = 3
[profile.release.package.sm3]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.gzipf]
opt-level = 3
[profile.release.package.zstd-sys]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = 3
[profile.release.package.liblzma-sys]
opt-level = 3
[profile.release.package.libbz2-rs-sys]
opt-level = 3
[profile.release.package.lzma-rust2]
opt-level = 3
[profile.release.package.lzvn-core]
opt-level = 3
[profile.release.package.cmpfs]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.ms-compress]
opt-level = 3
[profile.release.package.lz4_flex]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3

# Performance-oriented comparison profile for parser, decompression, hash,
# and snapshot benchmarks. The shipping `release` profile remains size-first
# until representative evidence workloads justify changing that default.
[profile.release-fast]
inherits = "release"
opt-level = 3

# notatin 1.0.1 (last released 2023-08) declares `nom = ">= 6"` with no upper
# bound. Cargo resolves that to nom 8.x, whose Parser combinator API broke the
# call-syntax notatin relies on. Upstream is unmaintained; we vendor a copy
# under vendor/notatin and use the path patch so Cargo picks the vendored
# tree (which compiles cleanly against nom 7.x).
[patch.crates-io]
notatin = { path = "vendor/notatin" }

