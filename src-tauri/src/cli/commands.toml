description = "搜索 ID；省略时自动生成，取消时交给 tasks cancel"

[[command]]
path = "searches list"
ipc = "global_search_history_list"
summary = "列出搜索历史"
category = "read"
concurrent = true

[[command]]
path = "searches delete"
ipc = "global_search_history_delete"
summary = "删除一次搜索及其命中"
category = "delete"
args = ["searchId"]

[[command]]
path = "searches export"
ipc = "global_search_export"
summary = "导出搜索命中为 CSV"
category = "action"
args = ["searchId"]
no_clobber = ["destination"]

[[command]]
path = "searches hits list"
ipc = "global_search_hits_page"
summary = "分页列出搜索命中"
category = "read"
concurrent = true
[command.params.distinct]
type = "enum"
values = ["file", "sha256"]
description = "按文件或按哈希去重"
[command.params.afterSeq]
description = "增量轮询游标"

