# lovelycarve-cli command schema.
#
# The CLI is a generic shell over the backend command registry
# (`generate_handler!` in src/lib.rs). Every registered operation is exposed
# here as exactly one `<collection> [<collection>…] <verb>` command, or listed
# under [[superseded]] with the command that replaces it. Hand-written commands
# (`native`) declare their parameters here as well, so search, `schema`, help,
# completion and the JSONL session all read one catalogue.
#
# build/cli_catalog.rs enforces the rules at build time:
# - collections are plural kebab-case nouns and the last word is the verb;
#   get, never info/status/show; delete, never remove/drop/unload; list, never
#   ls/page/query; update replaces a whole value, edit changes part of it;
# - `list` commands take no positional arguments; other commands take their
#   subject (the resource the verb acts on) as the positional argument;
# - every command path is unique and no command path is the prefix of another;
# - every parameter named here exists, and option names do not collide with
#   the reserved CLI options (--image, --case, --quiet, --dry-run, --body,
#   --force, --text, --json, --output, --experimental-*, …); a parameter's
#   `short` alias may not be -i, -q, -h, -v, -f or -c;
#   be -i, -q, -h, -v or -f;
# - `delete` commands, and commands with `confirm`, ask before running and
#   take --force; secrets are prompted without echo and redacted in --dry-run;
# - every `examples` entry starts with `lovelycarve-cli `.
#
# `hide_command = true` keeps a command runnable and searchable but out of
# help, completion and command suggestions; `examples` appear in its help.
#
# Parameter names are the backend's camelCase argument names: they are the
# keys of --body, of `schema` output and of JSONL session requests. Options are
# their kebab-case form unless [options] renames them.

[options]
# The evidence scope: an image ID or an evidence path.
imageId = "image"

[descriptions]
imageId = "检材 ID 或检材路径（路径会先打开）；默认取 --image、LOVELYCARVE_IMAGE 或会话当前检材"
nodeId = "文件节点 ID（files list 输出的 items[].id）；也可改用镜像内路径"
parentId = "目录节点 ID；也可改用 --path 指定镜像内路径"
rootId = "根目录节点 ID；也可改用 --path 指定镜像内路径"
path = "镜像内路径：以 / 开头为绝对路径（/ 下是分区和卷），否则相对会话当前目录"
taskId = "任务 ID，可交给 tasks cancel；省略时自动生成"
destination = "主机上的输出路径"
partitionId = "分区序号（images get 返回的 partitions[].id）"
scanId = "恢复扫描 ID（carve scans create 返回的 scanId）"
searchId = "搜索 ID（searches create 返回的 searchId）"
cursor = "上一页返回的 nextCursor"
pageSize = "每页条数"
limit = "最多返回的条数"
skip = "跳过的条数"
offset = "起始偏移"
maxBytes = "最多读取的字节数"
volumeKey = "卷键，例如 part:0（见 indexes list）"
nodeIds = "节点 ID 数组（单次最多 5000 个）"
parentIds = "目录节点 ID 数组"
mountId = "挂载 ID（mounts list 返回）"
pluginId = "插件 ID（plugins list 返回）"
readFaultPolicy = "坏扇区策略：zeroFillAndReport 补零并报告（默认），strict 遇坏扇区即失败"
dir = "案件目录"
key = "SQLCipher 等加密数据库的密钥（JSON）"

