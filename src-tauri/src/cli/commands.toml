# ── analysis ────────────────────────────────────────────────────────────────

[[command]]
path = "analysis tree get"
ipc = "analysis_result_tree"
summary = "查看分析结果树"
description = "分析结果树：检材 → 分类 → 分析器运行 → 记录类型。旧案件的插件结果以 legacy 节点只读列出。未打开案件时返回空树。"
category = "read"
concurrent = true

[[command]]
path = "analysis records list"
ipc = "analysis_records_page"
summary = "分页列出分析记录"
description = "按记录类型分页读取指定 runId 的记录，可按关键词过滤、按列排序；runId 来自分析结果树，分页期间固定运行身份。"
category = "read"
concurrent = true
defaults = { skip = 0, limit = 100 }
examples = [
    { command = "lovelycarve-cli analysis records list --run-id <runId> --record-type linux.user --sort uid", description = "按 UID 排序列出一次运行的用户记录" },
]
[command.params.runId]
description = "分析运行 ID（分析结果树节点的 runId）"
[command.params.recordType]
description = "记录类型（分析结果树结果项的 artifactType，如 linux.user）"
[command.params.legacy]
description = "读取旧案件的插件结果（结果树节点 legacy 为 true 时）"
[command.params.keyword]
description = "关键词：匹配标题与文本类列（ASCII 不区分大小写）"
[command.params.sort]
description = "排序列：列 id 或 title；省略时按记录产生顺序"
[command.params.descending]
description = "降序排列"

[[command]]
path = "analysis records get"
ipc = "analysis_record_detail"
summary = "查看一条分析记录"
category = "read"
args = ["recordId"]
concurrent = true
[command.params.recordId]
description = "记录 ID（analysis records list 返回的 recordId）"

[[command]]
path = "analysis runs get"
ipc = "analysis_run_get"
summary = "查看一次分析运行的审计信息"
description = "运行的目标、输入文件、选项、画像事实、告警与读不出而以零填充的源字节。"
category = "read"
args = ["runId"]
concurrent = true
[command.params.runId]
description = "分析运行 ID"

# ── bcp ─────────────────────────────────────────────────────────────────────

[[command]]
path = "bcp tables list"
ipc = "bcp_catalog"
summary = "列出检材中的 BCP 数据表"
category = "read"
concurrent = true

[[command]]
path = "bcp rows list"
ipc = "bcp_rows"
summary = "分页列出 BCP 数据表记录"
category = "read"
concurrent = true
[command.params.code]
description = "数据表编码（bcp tables list 返回）"
[command.params.cursor]
type = "json"
description = "上一页返回的游标（JSON）"

# ── bitlocker ───────────────────────────────────────────────────────────────

[[command]]
path = "bitlocker get"
ipc = "bitlocker_status"
summary = "查看 BitLocker 卷的锁定状态"
category = "read"
args = ["partitionId"]
concurrent = true

[[command]]
path = "bitlocker metadata get"
ipc = "bitlocker_metadata"
summary = "查看 BitLocker 元数据"
description = "读取算法、卷 GUID、FILETIME、卷描述与保护器类型，不需要凭据，也不返回密钥。"
category = "read"
args = ["partitionId"]
concurrent = true

[[command]]
path = "bitlocker unlock"
ipc = "bitlocker_unlock"
summary = "解锁 BitLocker 卷"
description = "用密码、48 位恢复密码、启动密钥（BEK）或 FVEK 解锁；都不传时尝试卷内的明文密钥。"
category = "action"
args = ["partitionId"]
secret = ["password", "recoveryPassword", "fvekHex", "tweakHex"]
generated = ["taskId"]
keywords = ["unlock bitlocker volume", "decrypt", "recovery key", "password", "bek"]
[command.params.recoveryPassword]
description = "48 位恢复密码"
[command.params.password]
description = "用户密码"
[command.params.startupKeyPath]
description = "启动密钥文件（.BEK）路径"
[command.params.fvekHex]
description = "完整卷加密密钥（十六进制）"
[command.params.tweakHex]
description = "Diffuser 方式的 tweak 密钥（十六进制）"

[[command]]
path = "bitlocker vmks scan"
ipc = "bitlocker_scan_memory"
summary = "在内存镜像中搜索 VMK"
category = "action"
args = ["memoryPath"]
generated = ["taskId"]
keywords = ["memory dump", "volume master key"]
[command.params.memoryPath]
description = "内存镜像文件路径"

[[command]]
path = "bitlocker vmks unlock"
ipc = "bitlocker_unlock_with_vmk"
summary = "用 VMK 解锁 BitLocker 卷"
category = "action"
args = ["partitionId"]
secret = ["vmkHex"]
generated = ["taskId"]
[command.params.vmkHex]
description = "卷主密钥（十六进制）"

[[command]]
path = "bitlocker export"
ipc = "bitlocker_export_decrypted_image"
summary = "导出解密后的 BitLocker 卷"
category = "action"
args = ["partitionId"]
generated = ["taskId"]
no_clobber = ["destination"]

# ── carve ───────────────────────────────────────────────────────────────────

[[command]]
path = "carve formats list"
ipc = "carve_formats"
summary = "列出可雕刻的文件格式"
category = "read"
concurrent = true

[[command]]
path = "carve scans create"
ipc = "carve_start"
summary = "开始文件恢复扫描"
description = "在后台开始文件系统记录恢复和签名雕刻；options 选择范围、格式和文件系统。"
category = "create"
keywords = ["recover deleted files", "carving", "undelete", "signature"]
[command.params.options]
description = "扫描选项 JSON，例如 {\"format_ids\":[\"jpeg\",\"png\"],\"scope\":\"whole\",\"filesystems\":{\"ntfs\":true}}"

[[command]]
path = "carve scans get"
ipc = "carve_scan_status"
summary = "查看恢复扫描状态"
category = "read"
args = ["scanId"]
concurrent = true

[[command]]
path = "carve scans pause"
ipc = "carve_scan_pause"
summary = "暂停恢复扫描"
category = "action"
args = ["scanId"]

[[command]]
path = "carve scans resume"
ipc = "carve_scan_resume"
summary = "继续恢复扫描"
category = "action"
args = ["scanId"]

[[command]]
path = "carve scans list"
ipc = "carve_scan_list"
summary = "列出检材的恢复扫描"
category = "read"
concurrent = true

[[command]]
path = "carve scans delete"
ipc = "carve_scan_remove"
summary = "删除已结束的恢复扫描"
description = "删除扫描会话及其内存结果，已恢复的文件不受影响。"
category = "delete"
args = ["scanId"]

[[command]]
path = "carve scans export"
ipc = "carve_recover"
summary = "导出恢复出的文件"
description = "把雕刻结果和文件系统记录写到 options.destination，并生成 JSONL 恢复报告。"
category = "action"
args = ["scanId"]
keywords = ["recover", "save recovered files"]
[command.params.options]
description = "导出选项 JSON，例如 {\"destination\":\"D:/out\",\"artifact_ids\":null,\"file_ids\":[\"0\"]}"

[[command]]
path = "carve artifacts list"
ipc = "carve_results_page"
summary = "分页列出雕刻结果"
category = "read"
concurrent = true
[command.params.filter]
type = "json"

[[command]]
path = "carve artifacts get"
ipc = "carve_preview"
summary = "读取一个雕刻结果的内容"
category = "read"
args = ["artifactId"]
concurrent = true

[[command]]
path = "carve files list"
ipc = "carve_filesystem_results"
summary = "列出文件系统恢复结果"
description = "文件系统阶段恢复出的卷、目录与候选文件；该阶段结束前返回 null。"
category = "read"
concurrent = true

# ── cases ───────────────────────────────────────────────────────────────────

[[command]]
path = "cases create"
ipc = "case_create"
summary = "创建案件"
description = "在目录中创建案件台账并打开它；已加载的无案件检材会登记进新案件。"
category = "create"
args = ["dir"]
keywords = ["new case", "investigation"]
[command.params.name]
description = "案件名称"
[command.params.caseNumber]
description = "案件编号"
[command.params.description]
description = "案件描述"
[command.params.examiner]
description = "检验人"

[[command]]
path = "cases open"
ipc = "case_open"
summary = "打开案件"
category = "action"
args = ["dir"]

[[command]]
path = "cases close"
ipc = "case_close"
summary = "关闭当前案件"
category = "action"

[[command]]
path = "cases get"
ipc = "case_active"
summary = "查看当前案件"
category = "read"
concurrent = true

[[command]]
path = "cases list"
ipc = "case_list"
summary = "列出本机登记的案件"
category = "read"
concurrent = true

[[command]]
path = "cases delete"
ipc = "case_remove"
summary = "删除案件"
description = "删除案件自己的文件（台账、锁、检材数据与暂存区）并注销登记，不触碰原始检材。"
category = "delete"
args = ["dir"]
confirm = "这会删除该案件目录中由 LovelyCarve 创建的台账、检材数据与暂存区。"

[[command]]
path = "cases edit"
ipc = "case_rename"
summary = "修改当前案件名称"
category = "update"
[command.params.name]
description = "新的案件名称"

[[command]]
path = "cases lock"
ipc = "case_lock"
summary = "锁定当前案件"
category = "action"

[[command]]
path = "cases unlock"
ipc = "case_unlock"
summary = "解除当前案件的锁定"
category = "action"

[[command]]
path = "cases options list"
ipc = "case_option_query"
summary = "列出案件级设置"
category = "read"
concurrent = true
[command.params.prefix]
description = "只列出以此为前缀的设置键"

[[command]]
path = "cases options edit"
ipc = "case_option_save"
summary = "写入案件级设置"
category = "update"
[command.params.entries]
description = "设置数组 JSON，例如 [{\"key\":\"k\",\"value\":\"v\"}]"

[[command]]
path = "cases evidence list"
ipc = "case_evidence_list"
summary = "列出案件中的检材"
category = "read"
concurrent = true

[[command]]
path = "cases evidence delete"
ipc = "case_evidence_remove"
summary = "从案件中移除检材"
description = "删除检材在案件中的登记和派生数据（索引、搜索、时间线等），不触碰原始检材。"
category = "delete"
args = ["imageId"]

# ── roots (hand-written) ────────────────────────────────────────────────────

[[command]]
path = "schema"
native = "schema"
summary = "查看命令的后端请求结构"
description = "输出生成命令发送的后端请求：operationId、IPC 命令名与参数（API 名称、类型、是否必填、说明）。--list 列出全部。"
category = "read"
args = ["command"]
concurrent = true
examples = [
    { command = "lovelycarve-cli schema images open", description = "查看 images open 发送的后端请求" },
    { command = "lovelycarve-cli schema --list", description = "列出全部生成命令的请求结构" },
]
[command.params.command]
type = "array"
description = "命令路径，例如 images open"
[command.params.list]
type = "boolean"
description = "列出全部命令的请求结构"

[[command]]
path = "complete"
native = "complete"
summary = "生成并处理 shell 补全"
description = "输出补全脚本；按 Tab 时 shell 以 complete -- <单词…> 回调本命令取得候选。"
category = "read"
args = ["shell"]
keywords = ["tab completion", "bash", "zsh", "fish", "powershell"]
examples = [
    { command = "lovelycarve-cli complete powershell >> $PROFILE", description = "安装 PowerShell 补全（重开终端后生效）" },
    { command = "lovelycarve-cli complete bash >> ~/.bashrc", description = "安装 bash 补全（重开终端后生效）" },
    { command = "lovelycarve-cli complete zsh >> ~/.zshrc", description = "安装 zsh 补全（重开终端后生效）" },
    { command = "lovelycarve-cli complete fish > ~/.config/fish/completions/lovelycarve-cli.fish", description = "安装 fish 补全" },
]
[command.params.shell]
type = "enum"
values = ["bash", "zsh", "fish", "powershell"]
description = "要生成补全脚本的 shell"

[[command]]
path = "tools"
native = "tools"
summary = "输出 MCP 工具定义"
description = "把全部命令转换成 MCP 工具定义（名称、说明与输入结构），供 MCP 服务器包装本程序。"
category = "read"
concurrent = true
hide_command = true
keywords = ["mcp", "model context protocol", "tool definitions"]
examples = [{ command = "lovelycarve-cli tools > tools.json", description = "保存全部工具定义" }]

[[command]]
path = "session"
native = "session"
summary = "以 JSONL 在一个进程内连续执行命令"
description = "从标准输入逐行读取 {\"id\",\"command\",\"args\"} 请求，每条结果写成一行 JSON；检材与案件在请求之间保持打开。"
category = "action"
keywords = ["jsonl", "batch", "automation", "agent", "stdin"]
