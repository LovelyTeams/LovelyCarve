# ── tasks ───────────────────────────────────────────────────────────────────

[[command]]
path = "tasks list"
ipc = "task_list"
summary = "列出任务中心的任务"
description = "插件任务与内置任务（加载、哈希、导出、解锁、平台识别、快照与索引、全局搜索、时间线、文件恢复、Docker 合并）：运行中的、本次会话结束的，以及搜索历史、时间线状态与恢复扫描各自保留的。插件任务的 id 为 plugin:<ID>；不属于任何检材的任务（打开检材）总会列出。"
category = "read"
concurrent = true
[command.params.imageId]
description = "只列这个检材的任务；省略时列出全部检材"

[[command]]
path = "tasks get"
ipc = "task_status"
summary = "查看任务"
category = "read"
args = ["taskId"]
concurrent = true
[command.params.taskId]
description = "任务 ID（tasks list 返回的 id）"

[[command]]
path = "tasks cancel"
ipc = "task_cancel"
summary = "取消任务"
description = "内置任务给它的 id，插件任务给 plugin:<ID>。取消是协作式的：任务在下一个检查点停下。"
category = "action"
args = ["taskId"]
concurrent = true
[command.params.taskId]
description = "任务 ID（tasks list 返回的 id）"

[[command]]
path = "tasks wait"
native = "tasks-wait"
summary = "等待后台任务与插件任务结束"
description = "只表示任务不再活动；结果请读取对应的状态或结果命令。"
category = "action"

