[package]
name = "hammer2-reader"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Read-only DragonFly BSD HAMMER2 filesystem"

[dependencies]
crc32c = "0.6"
lamfold = { path = "../lamfold", default-features = false, features = ["std"] }
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-decode"] }
miniz_oxide = { version = "0.9", features = ["std"] }
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
flate2 = "1"

[workspace]
