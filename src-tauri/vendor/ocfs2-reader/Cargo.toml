[package]
name = "ocfs2-reader"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["LovelyCarve contributors"]
description = "Immutable OCFS2 clustered filesystem image reader"

[dependencies]
crc32fast = "1"
lamfold = { path = "../lamfold", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
flate2 = "1"

[workspace]
