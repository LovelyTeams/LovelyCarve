[package]
name = "bcachefs-reader"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Read-only evidence adapter for the pure Rust bcachefs reader"

[dependencies]
lamfold = { path = "../lamfold", features = ["std"] }
rust-fs-bcachefs = { path = "../rust-fs-bcachefs", default-features = false }
rust-fs-core = { path = "../rust-fs-core", default-features = false }

[dev-dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.10"

[workspace]
