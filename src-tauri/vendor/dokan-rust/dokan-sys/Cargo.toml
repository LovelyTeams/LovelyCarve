[package]
name = "dokan-sys"
version = "0.3.1+dokan206"
authors = ["DDoSolitary <DDoSolitary@gmail.com>"]
edition = "2021"
description = "Raw FFI bindings for Dokan (user mode file system library for Windows), loading dokan2.dll at run time"
license = "MIT"
repository = "https://github.com/dokan-dev/dokan-rust"
publish = false

[dependencies]
libc = "0.2.82"
libloading = "0.9.0"
thiserror = "2.0.21"
winapi = { version = "0.3.9", features = ["std", "basetsd", "fileapi", "handleapi", "libloaderapi", "minwinbase", "minwindef", "ntdef", "ntstatus", "winbase", "winnt"] }
