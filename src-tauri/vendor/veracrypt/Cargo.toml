[package]
name = "veracrypt-core"
description = "Pure-Rust VeraCrypt/TrueCrypt reader: every PRF and cipher chain, PIM, keyfiles, hidden/backup/system headers, parallel header search and XTS decryption."
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Albert Hui <albert@securityronin.com>", "LovelyCarve contributors"]
repository = "https://github.com/SecurityRonin/veracrypt-forensic"
readme = "README.md"
keywords = ["veracrypt", "truecrypt", "forensics", "encryption", "xts"]
categories = ["cryptography", "filesystem", "parser-implementations"]

[lib]
name = "veracrypt"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
blake2 = "0.10"
camellia = { version = "0.1", features = ["zeroize"] }
cipher = "0.4"
crc32fast = "1"
hmac = "0.12"
kuznyechik = { version = "0.8", features = ["zeroize"] }
rayon = "1"
ripemd = "0.1"
serpent = { version = "0.5", features = ["zeroize"] }
sha2 = "0.10"
streebog = "0.10"
thiserror = "2"
twofish = { version = "0.7", features = ["zeroize"] }
whirlpool = "0.10"
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde_json = "1"
xts-mode = "0.5"

# Standalone runs (`just test-veracrypt`) derive 16000-iteration header keys
# for every PRF; optimise the dependencies so the suite stays quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
