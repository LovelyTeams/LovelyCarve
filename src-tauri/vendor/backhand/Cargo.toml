[package]
edition = "2024"
rust-version = "1.90"
name = "backhand"
version = "0.25.5"
authors = ["wcampbell <wcampbell1995@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for the reading, creating, and modification of SquashFS file systems"
readme = "README.md"
keywords = [
    "filesystem",
    "deku",
    "squashfs",
    "linux",
]
categories = [
    "filesystem",
    "parsing",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wcampbell0x2a/backhand"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "xz",
    "gzip",
    "zstd",
    "document-features",
    "v3",
    "v3_lzma",
    "v4_lzma",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
v1_v2 = ["gzip", "v3_lzma", "dep:lzma-rs"]
any-gzip = []
default = [
    "xz",
    "gzip",
    "zstd",
    "parallel",
    "error-strings",
    "descriptive-errors",
]
descriptive-errors = ["deku/descriptive-errors"]
error-strings = ["dep:tracing"]
gzip = [
    "any-gzip",
    "dep:flate2",
]
lz4 = ["dep:lz4_flex"]
lzo = ["dep:rust-lzo"]
parallel = ["dep:rayon"]
v3 = ["gzip"]
v3_ddwrt = ["v3", "dep:lzma-rust2"]
v3_lzma = [
    "v3",
    "dep:lzma-rust2",
]
v4_lzma = [
    "dep:lzma-rust2",
]
xz = [
    "dep:lzma-rust2",
    "dep:crc32fast",
]
xz-static = ["xz"]
zstd = [
    "dep:ms-compress-ruzstd",
]
# Optional upstream writer; the LovelyCarve reader does not enable this feature.
zstd-write = [
    "zstd",
    "dep:zstd",
    "dep:zstd-safe",
]

[lib]
name = "backhand"
path = "src/lib.rs"
bench = false



[dependencies.deku]
version = "0.20.1"
features = [
    "std",
    "bits",
]
default-features = false

[dependencies.crc32fast]
version = "1.5"
