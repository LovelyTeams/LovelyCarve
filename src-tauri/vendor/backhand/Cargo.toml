features = ["raw_decoder"]
optional = true

[dependencies.no_std_io2]
version = "0.9.4"
features = ["std"]

[dependencies.ms-compress-ruzstd]
version = "0.9.1"
optional = true

[dependencies.rayon]
version = "1.12.0"
optional = true
default-features = false

[dependencies.rust-lzo]
version = "0.6.2"
