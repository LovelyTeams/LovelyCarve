[package]
name = "lovelycarve-python"
version = "1.2.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only"
description = "Read-only Python bindings for LovelyCarve image and filesystem readers"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
lovelycarve = { path = "../src-tauri", default-features = false, features = ["reader-library"] }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde = "1.0.229"
serde_json = "1.0.154"

# Cargo uses patches from the final crate; preserve the backend's maintained copy.
[patch.crates-io]
notatin = { path = "../src-tauri/vendor/notatin" }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[lints.clippy]
uninlined_format_args = "warn"
unwrap_used = "warn"
expect_used = "warn"
