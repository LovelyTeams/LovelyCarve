name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/windows-tests.yml

  macos:
    uses: ./.github/workflows/macos-arm64.yml

  windows:
    name: Package Windows x64
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check tag and manifest versions
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $rustVersion = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $pythonVersion = [regex]::Match((Get-Content python/pyproject.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $pythonRustVersion = [regex]::Match((Get-Content python/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $componentVersion = [regex]::Match((Get-Content src-tauri/components/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' -or $tag.Split('-')[0] -ne "v$version" -or $version -ne $tauriVersion -or $version -ne $rustVersion -or $version -ne $pythonVersion -or $version -ne $pythonRustVersion -or $version -ne $componentVersion) {
            throw "Tag $tag does not match manifest versions: $version / $tauriVersion / $rustVersion / $pythonVersion / $pythonRustVersion / $componentVersion"
          }
      - uses: ./.github/actions/setup-windows
      - name: Build desktop MSI
        run: just build-release --bundles msi
      - name: Build and package CLI
        run: just pack-cli
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.28'
      - name: Build Python wheel
        env:
          LOVELYCARVE_PYTHON: '3.10'
        run: |
          $env:OPENSSL_LIB = Join-Path $env:OPENSSL_DIR 'lib/VC/x64/MD'
          just build-python
      - name: Stage Windows packages
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -File)
          $cliPackages = @(Get-ChildItem dist-pack/lovelycarve-cli-*.zip -File)
          $version = $env:GITHUB_REF_NAME.Split('-')[0].Substring(1)
          $wheels = @(Get-ChildItem "dist-pack/python/lovelycarve-$version-*-win_amd64.whl" -File)
          if ($installers.Count -ne 1 -or $cliPackages.Count -ne 1 -or $wheels.Count -ne 1) {
            throw 'Expected one MSI, CLI ZIP and Python wheel for Windows x64'
          }
          $assets = $installers + $cliPackages + $wheels
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $assets | Copy-Item -Destination release-assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lovelycarve-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Stage wheel for PyPI
        if: github.repository == 'LovelyTeams/LovelyCarve' && !contains(github.ref_name, '-')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pypi-wheel
          path: release-assets/*.whl
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [tests, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lovelycarve-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages and write checksums
        shell: bash
        working-directory: release-assets
        run: |
          shopt -s nullglob
          version=${GITHUB_REF_NAME%%-*}
          version=${version#v}
          msi=(LovelyCarve_"${version}"_x64_*.msi)
          zip=(lovelycarve-cli-v"${version}"-win-x64-*.zip)
          wheel=(lovelycarve-"${version}"-*-win_amd64.whl)
          dmg="LovelyCarve-v${version}-macos-arm64.dmg"
          tarball="lovelycarve-cli-v${version}-macos-arm64.tar.gz"
          test "${#msi[@]}" -eq 1
          test "${#zip[@]}" -eq 1
          test "${#wheel[@]}" -eq 1
          assets=("${msi[0]}" "${zip[0]}" "${wheel[0]}" "$dmg" "$tarball")
          for file in "${assets[@]}"; do test -s "$file"; done
          files=(*)
          test "${#files[@]}" -eq "${#assets[@]}"
          sha256sum -- "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          Builds from ${GITHUB_SHA}. QR/OCR is disabled on both platforms.

          - **Windows x64** offers a desktop MSI, a standalone CLI ZIP and a Python wheel for CPython 3.10+. Windows binaries are unsigned. Dokany mounts require a separate driver.
          - **macOS 15+ on Apple Silicon** offers a desktop DMG and a standalone CLI tarball. The app is ad-hoc signed and has no Apple notarization. Gatekeeper may require approval in Privacy & Security.

          SHA-256 hashes for all packages are in \`SHA256SUMS.txt\`. See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for changes and compatibility notes.

          Clone the source with \`git clone --recurse-submodules https://github.com/${GITHUB_REPOSITORY}.git\`, check out \`${GITHUB_REF_NAME}\` and run \`git submodule update --init --recursive\`.
          EOF
          args=(--verify-tag --title "LovelyCarve $GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" release-assets/*

  publish-pypi:
    name: Publish Python wheel to PyPI
    if: github.repository == 'LovelyTeams/LovelyCarve' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheel
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Upload wheel
        run: uv publish --no-config --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl
