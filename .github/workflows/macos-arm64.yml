name: macOS ARM64 compile

on:
  push:
    branches: [codex/macos-arm64]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: Native Apple Silicon desktop and CLI
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@v4
      - name: Configure native Rust and OpenSSL
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          rust_version="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"
          test -n "$rust_version"
          if [[ "$rust_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            rust_version="$rust_version.0"
          fi
          toolchain="$rust_version-aarch64-apple-darwin"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          openssl_dir="$(brew --prefix openssl@3)"
          test -f "$openssl_dir/lib/libcrypto.a"
          {
            echo "OPENSSL_DIR=$openssl_dir"
            echo 'OPENSSL_NO_VENDOR=1'
            echo 'OPENSSL_STATIC=1'
          } >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: macos-dependencies-${{ runner.arch }}-${{ hashFiles('bun.lock', '**/Cargo.lock') }}
          restore-keys: macos-dependencies-${{ runner.arch }}-
      - run: just bootstrap
      - run: just build-plugins --release
      - run: just build-macos
      - run: just build-cli
      - name: Verify native binaries and archive artifact
        shell: bash
        run: |
          desktop=src-tauri/target/release/LovelyCarve
          cli=src-tauri/target/release/lovelycarve-cli
          plugin_host=plugins/target/release/lc-plugin-host
          plugin=plugins/linuxinfo/liblinuxinfo.dylib
          inference=src-tauri/target/release/liblovelycarve_inference.dylib
          for binary in "$desktop" "$cli" "$plugin_host" "$plugin" "$inference"; do
            test "$(lipo -archs "$binary")" = arm64
            file "$binary"
            otool -L "$binary"
          done
          "$cli" --json system
          stage=macos-arm64
          mkdir -p "$stage/plugins/linuxinfo"
          cp "$desktop" "$cli" "$plugin_host" "$inference" LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          cp -R "$plugin" plugins/linuxinfo/{plugin.toml,schema.json,locales} "$stage/plugins/linuxinfo/"
          tar -czf lovelycarve-macos-arm64.tar.gz "$stage"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lovelycarve-macos-arm64
          path: lovelycarve-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
