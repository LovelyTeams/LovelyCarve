name: Windows ARM64 packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: Package Windows ARM64 desktop and CLI
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Stage the ARM64 Visual C++ runtime
        run: |
          . ./scripts/windows-env.ps1 -VisualStudio -OpenSSLDir $env:OPENSSL_DIR -OpenSSLLib $env:OPENSSL_LIB
          $crt = Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir 'arm64') -Filter 'Microsoft.VC*.CRT' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Missing the ARM64 Visual C++ redistributable files' }
          $stage = New-Item -ItemType Directory -Path src-tauri/target/arm64-runtime -Force
          Get-ChildItem -LiteralPath $crt.FullName -Filter '*.dll' -File | Copy-Item -Destination $stage.FullName
          foreach ($name in 'vcruntime140.dll', 'msvcp140.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $stage.FullName $name) -PathType Leaf)) { throw "Missing ARM64 runtime $name" }
          }
      - name: Build desktop installer and bundled plugins
        run: just build-release --bundles nsis --config "${{ github.workspace }}/src-tauri/tauri.arm64.conf.json"
      - name: Package standalone CLI
        run: just pack-cli -Arm64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.28'
      # The abi3 wheel is tagged for CPython 3.10+ whichever interpreter builds it.
      - name: Build Python wheel
        env:
          LOVELYCARVE_PYTHON: '3.12'
        run: just build-python
      - name: Install the Python wheel and import it natively
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $wheels = @(Get-ChildItem "dist-pack/python/lovelycarve-$version-*-win_arm64.whl" -File)
          if ($wheels.Count -ne 1) { throw 'Expected one Windows ARM64 Python wheel' }
          $venv = Join-Path $env:RUNNER_TEMP 'lovelycarve-wheel'
          uv venv $venv --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Creating the wheel test environment failed' }
          $python = Join-Path $venv 'Scripts/python.exe'
          uv pip install --python $python $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installing the wheel failed' }
          & $python -c "import lovelycarve, platform, sys; assert lovelycarve.__version__ == sys.argv[1], lovelycarve.__version__; assert platform.machine() == 'ARM64', platform.machine()" $version
          if ($LASTEXITCODE -ne 0) { throw 'Importing the wheel failed' }
      - name: Install the desktop package and verify native binaries
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/LovelyCarve_${version}_arm64-setup.exe" -File)
          $cliPackages = @(Get-ChildItem "dist-pack/lovelycarve-cli-v${version}-win-arm64-*.zip" -File)
          if ($installers.Count -ne 1 -or $cliPackages.Count -ne 1) { throw 'Expected an ARM64 installer and CLI ZIP' }
          $installDir = Join-Path $env:RUNNER_TEMP 'lovelycarve-arm64-install'
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "ARM64 installer exited with $($setup.ExitCode)" }
          $cliDir = Join-Path $env:RUNNER_TEMP 'lovelycarve-arm64-cli'
          Expand-Archive -LiteralPath $cliPackages[0].FullName -DestinationPath $cliDir
          $cliDir = Join-Path $cliDir $cliPackages[0].BaseName
          $binaries = @(
            (Join-Path $installDir 'LovelyCarve.exe'),
            (Join-Path $cliDir 'lovelycarve-cli.exe')
          )
          foreach ($directory in $installDir, $cliDir) {
            # Mounts load the ARM64 dokan2.dll that Dokany installs in System32.
            if (Test-Path -LiteralPath (Join-Path $directory 'dokan2.dll')) { throw 'ARM64 packages must not ship the x64 dokan2.dll' }
            foreach ($file in 'lc-plugin-host.exe', 'lovelycarve_inference.dll', 'msvcp140.dll', 'vcruntime140.dll', 'plugins/linuxinfo/linuxinfo.dll') {
              $binaries += Join-Path $directory $file
            }
          }
          foreach ($binary in $binaries) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $binary).Path)
            $header = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $header + 4)
            if ($machine -ne 0xaa64) {
              throw ('Expected ARM64: {0} has machine type 0x{1:X4}' -f $binary, $machine)
            }
            Write-Host "$binary is ARM64"
          }
          $capabilities = & (Join-Path $cliDir 'lovelycarve-cli.exe') --json system | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $capabilities.version -ne $version -or $capabilities.platform -ne 'windows' -or -not $capabilities.components.inference.available -or -not $capabilities.components.inference.fileTypes) {
            throw "Unexpected ARM64 CLI capabilities: $($capabilities | ConvertTo-Json -Depth 10 -Compress)"
          }
          $wheels = @(Get-ChildItem "dist-pack/python/lovelycarve-$version-*-win_arm64.whl" -File)
          New-Item -ItemType Directory -Path release-assets | Out-Null
          ($installers + $cliPackages + $wheels) | Copy-Item -Destination release-assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lovelycarve-windows-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
